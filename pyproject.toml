[project]
name = "ibackup-browser"
version = "0.2.0"
description = "A local, read-only iPod-style browser for iOS backups"
requires-python = ">=3.12"
dependencies = ["cryptography>=44,<47", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
